<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cookbook</title>
<!-- Entry page: loads the app from source and the catalogue as plain JSON, so
     site/app.js and site/styles.css can be edited without repacking the bundle. The
     figure picker also needs this, since it reads the manifest and the images from
     disk. Serve the repo root: python3 -m http.server 8931 -->
<link rel="stylesheet" href="site/styles.css">
<style>#boot { padding: 90px 28px; font: 13px "Helvetica Neue", Helvetica, Arial, sans-serif; color: #666; }
#boot b { display: block; font-size: 30px; color: #111; margin-bottom: 12px; letter-spacing: -.028em; }</style>
</head>
<body>
<div id="root"><div id="boot"><b>A Design Cookbook for UI/UX of AI</b>Loading the catalogue…</div></div>
<script src="build/vendor/react.production.min.js"></script>
<script src="build/vendor/react-dom.production.min.js"></script>
<script src="site/app.js"></script>
<script>
function grab(u) {
  return fetch(u).then(function (r) { if (!r.ok) throw new Error(u + ' — HTTP ' + r.status); return r.json(); });
}
// The exemplar figures are a separate file here; the packed bundle inlines both.
Promise.all([grab('build/cookbook_v2.json'), grab('build/exemplars_web.json')])
  .then(function (both) { both[0].exemplars = both[1]; window.__mountCookbook(both[0]); })
  .catch(function (e) {
    document.getElementById('boot').innerHTML =
      '<b>Could not load the catalogue</b>' + e.message +
      '<br><br>Serve the repo root — python3 -m http.server 8931 — and open http://localhost:8931/index.html';
  });
</script>
</body>
</html>
